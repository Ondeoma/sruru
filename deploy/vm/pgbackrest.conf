# /etc/pgbackrest/pgbackrest.conf（3台とも同じ。バックアップの置き場所は S3 互換ストレージ。可能なら別の拠点にも複製する）
[global]
repo1-type=s3
repo1-s3-endpoint=10.0.0.10
repo1-s3-uri-style=path
repo1-s3-bucket=sruru-backup
repo1-s3-region=us-east-1
repo1-s3-key=change-me
repo1-s3-key-secret=change-me
repo1-storage-port=7480
repo1-storage-verify-tls=n
repo1-path=/pgbackrest
repo1-retention-full=4
start-fast=y
compress-type=zst

[sruru]
pg1-path=/var/lib/postgresql/17/sruru
pg1-port=5432
