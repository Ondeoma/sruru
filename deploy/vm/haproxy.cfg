# /etc/haproxy/haproxy.cfg（3台とも同じ）。VIP(10.0.0.10) は keepalived が持つ。
global
  log /dev/log local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend https
  # クライアント証明書でのログインを使うなら ca-file（利用者の証明書を発行する認証局）と verify optional を付ける。
  # 証明書は X-SSL-Client-Cert ヘッダーでアプリに渡す（DER の base64）。アプリは「信頼するプロキシ」からのヘッダーだけを使う
  bind :443 ssl crt /etc/haproxy/certs/id.example.com.pem alpn h2,http/1.1 ca-file /etc/haproxy/client-ca.pem verify optional
  bind :80
  http-request redirect scheme https unless { ssl_fc }
  http-request set-header X-Forwarded-Proto https
  # 利用者が送ってきた同名のヘッダーは必ず消す（なりすまし防止）
  http-request del-header X-SSL-Client-Cert
  http-request set-header X-SSL-Client-Cert %[ssl_c_der,base64] if { ssl_c_used } { ssl_c_verify 0 }
  option forwardfor
  default_backend sruru
backend sruru
  balance roundrobin          # アプリはステートレス（セッション・署名鍵も DB）なので、振り分けは単純でよい
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server sruru1 10.0.0.11:8080 check
  server sruru2 10.0.0.12:8080 check
  server sruru3 10.0.0.13:8080 check
frontend stats
  bind 127.0.0.1:8404
  stats enable
  stats uri /
